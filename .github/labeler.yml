content:
  - changed-files:
      - any-glob-to-any-file: ['index.html', '404.html', 'public/**', 'assets/img/**']
design:
  - changed-files:
      - any-glob-to-any-file: ['css/**', 'assets/fonts/**']
scripts:
  - changed-files:
      - any-glob-to-any-file: ['js/**', 'apps-script/**']
build:
  - changed-files:
      - any-glob-to-any-file: ['vite.config.js', 'infra/**', 'scripts/**', 'package.json', 'bun.lock', 'bunfig.toml']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'tests/**', 'playwright.config.js', 'lighthouserc.json', 'linkinator.config.json']
docs:
  - changed-files:
      - any-glob-to-any-file: ['*.md', 'docs/**']
