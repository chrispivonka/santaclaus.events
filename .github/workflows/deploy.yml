name: Deploy

# GitHub Actions builds the site and publishes it to AWS: a private S3 bucket behind CloudFront
# per environment (infra/site.yml), reached through an IAM role assumed with GitHub's OIDC token,
# so there are no long-lived AWS keys anywhere:
#
#   push to development -> preprod (https://preview.santaclaus.events), smoke-tested
#   release tag         -> production (https://santaclaus.events), smoke-tested, security-scanned;
#                          the smoke tests failing redeploys the previous release
#
# Production has no branch trigger on purpose. The Release workflow dispatches this one with
# the tag it just created, after CI went green on main, so production can never be "whatever
# main is right now". The tag must be an ancestor of main; anything else is refused.
#
# Each GitHub environment (preprod, production) needs the variables AWS_ROLE_ARN, S3_BUCKET and
# CLOUDFRONT_DISTRIBUTION_ID: the outputs of that environment's CloudFormation stack. Until they
# are set, the deploy jobs skip with a notice. The repository variables PREPROD_URL and
# PRODUCTION_URL say where the checks look (defaults: the two URLs above).
#
# A release that changes apps-script/ also pushes the forms' Google Apps Scripts (see the
# apps-script job and apps-script/README.md).
on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy to production (for example v2026.12.01)'
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.tag && 'production' || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  preprod:
    name: Preprod deployment (development)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: preprod
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check the AWS settings are present
        id: gate
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$S3_BUCKET" ] || [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "::notice::No preprod deployment: add AWS_ROLE_ARN, S3_BUCKET and CLOUDFRONT_DISTRIBUTION_ID to the preprod environment's variables (see CONTRIBUTING.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - if: steps.gate.outputs.run == 'true'
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish to S3 and CloudFront
        id: deploy
        if: steps.gate.outputs.run == 'true'
        env:
          PREPROD_URL: ${{ vars.PREPROD_URL || 'https://preview.santaclaus.events' }}
        run: |
          node scripts/deploy-aws.js
          echo "url=$PREPROD_URL" >> "$GITHUB_OUTPUT"

  production:
    name: Production deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check the AWS settings are present
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$S3_BUCKET" ] || [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "::error::Add AWS_ROLE_ARN, S3_BUCKET and CLOUDFRONT_DISTRIBUTION_ID to the production environment's variables (see CONTRIBUTING.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse anything that is not a release tag on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v20[0-9][0-9].[0-9][0-9].[0-9][0-9]|v20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*) ;; *)
            echo "::error::'$TAG' is not a release tag (vYYYY.MM.DD)"; exit 1 ;;
          esac
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main \
            || { echo "::error::$TAG is not on main; only released commits deploy to production"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish to S3 and CloudFront
        id: deploy
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://santaclaus.events' }}
        run: |
          node scripts/deploy-aws.js
          echo "url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the deployment
    needs: [preprod, production]
    if: always() && contains(needs.*.result, 'success') && (needs.preprod.outputs.url != '' || needs.production.outputs.url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_URL: ${{ needs.production.outputs.url || needs.preprod.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - run: npx playwright install --with-deps chromium
      - name: Wait for the deployment to answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/")
            [ "$code" = "200" ] && exit 0
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::$BASE_URL did not answer 200 in time"; exit 1
      - name: Smoke, accessibility and header tests against ${{ env.BASE_URL }}
        run: npx playwright test --project=chromium --project=mobile-chrome

  # The forms' Google Apps Scripts, pushed with clasp when a release changes them. Both the
  # preview and the live site post to the same two web apps, so they update with production only.
  # Each project's existing deployment gets a new version, so its URL (built into the site) stays.
  # Until the production environment has the script's secret and variables, it skips with a notice.
  apps-script:
    name: Apps Script (${{ matrix.project }})
    needs: [production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
    strategy:
      fail-fast: false
      matrix:
        project: [letter, booking]
    env:
      PROJECT: ${{ matrix.project }}
      TAG: ${{ inputs.tag }}
      SCRIPT_ID: ${{ matrix.project == 'letter' && vars.LETTER_SCRIPT_ID || vars.BOOKING_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ matrix.project == 'letter' && vars.LETTER_DEPLOYMENT_ID || vars.BOOKING_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether this release changes the script
        id: gate
        env:
          HAS_CREDENTIALS: ${{ (matrix.project == 'letter' && secrets.CLASPRC_LETTER || secrets.CLASPRC_BOOKING) != '' }}
        run: |
          if [ "$HAS_CREDENTIALS" != "true" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::notice::Skipping $PROJECT.gs: add its clasp credentials secret and script and deployment IDs to the production environment (see apps-script/README.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="apps-script/common.gs apps-script/$PROJECT.gs apps-script/appsscript.json"
          previous=$(git describe --tags --abbrev=0 --match 'v20*' "$TAG^" 2>/dev/null || true)
          # shellcheck disable=SC2086 # files is a list of paths
          if [ -n "$previous" ] && git diff --quiet "$previous" "$TAG" -- $files; then
            echo "::notice::$PROJECT.gs is unchanged since $previous; nothing to deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Push and redeploy ${{ matrix.project }}.gs
        if: steps.gate.outputs.run == 'true'
        env:
          CLASPRC: ${{ matrix.project == 'letter' && secrets.CLASPRC_LETTER || secrets.CLASPRC_BOOKING }}
        run: |
          umask 077
          auth="$RUNNER_TEMP/clasprc.json"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$CLASPRC" > "$auth"
          dir="$RUNNER_TEMP/$PROJECT"
          mkdir -p "$dir"
          cp apps-script/common.gs "apps-script/$PROJECT.gs" apps-script/appsscript.json "$dir/"
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > "$dir/.clasp.json"
          cd "$dir"
          clasp() { npx --yes @google/clasp@3.4.1 --auth "$auth" "$@"; }
          clasp push --force
          clasp update-deployment "$DEPLOYMENT_ID" --description "$TAG"

  # Outside-in scans of the live site, production only: a passive OWASP ZAP baseline scan and
  # Mozilla's HTTP Observatory grade. ZAP opens (or updates) an issue when it finds something.
  scan:
    name: Security scan (production)
    needs: [production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: ${{ needs.production.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Mozilla HTTP Observatory (fails below grade A)
        run: |
          host="${BASE_URL#https://}"; host="${host%%/*}"
          npx --yes @mdn/mdn-http-observatory@1.7.1 "$host" | tee observatory.txt
          grep -Eq '"grade": "A\+?"' observatory.txt || { echo "::error::HTTP Observatory grade is below A"; exit 1; }
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.BASE_URL }}
          rules_file_name: .github/zap-rules.tsv
          cmd_options: -a
          allow_issue_writing: true
          fail_action: true

  # The smoke tests failing against production means visitors are seeing a broken site right
  # now, so put the previous release back first and ask questions after.
  rollback:
    name: Roll production back
    needs: [production, verify]
    if: always() && needs.production.result == 'success' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Find the release before this one
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName --jq '.[].tagName' \
            | grep -A1 -x "$TAG" | sed -n 2p)
          if [ -z "$previous" ]; then
            echo "::error::Production checks failed after deploying $TAG and there is no earlier release to roll back to."
            exit 1
          fi
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.previous.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Redeploy the previous release
        env:
          TAG: ${{ inputs.tag }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          node scripts/deploy-aws.js
          echo "::error::Production checks failed after deploying $TAG; redeployed $PREVIOUS. Fix on development and release again."
          exit 1
