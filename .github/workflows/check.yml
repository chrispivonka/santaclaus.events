name: Check site

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate HTML
        run: npx html-validate index.html 404.html
      - name: Build
        run: npm run build
      - name: Check the built site
        run: npm run check
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun
