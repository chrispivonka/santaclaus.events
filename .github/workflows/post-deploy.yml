name: Post-deploy check

# Vercel reports each finished deployment back to GitHub. This runs the smoke tests and
# checks the real security and cache headers against the deployed URL.
on:
  deployment_status:

permissions: {}

jobs:
  smoke:
    name: Smoke test (${{ github.event.deployment.environment }})
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      IS_PRODUCTION: ${{ github.event.deployment.environment == 'Production' }}
    steps:
      - name: Skip protected previews without a bypass secret
        id: gate
        run: |
          if [ "$IS_PRODUCTION" != "true" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::Preview checks skipped: add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to enable them (see CONTRIBUTING.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke, accessibility and header tests against ${{ env.BASE_URL }}
        if: steps.gate.outputs.run == 'true'
        run: npx playwright test --project=chromium --project=mobile-chrome
