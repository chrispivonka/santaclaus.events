name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-s3
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Only the site files are published. Images, CSS and JS are cached for a
      # day; the HTML page is always revalidated so updates show up right away.
      - name: Deploy to S3
        run: |
          BUCKET="s3://${{ secrets.S3_BUCKET_NAME }}"
          aws s3 sync assets "$BUCKET/assets" --delete --cache-control "public, max-age=86400"
          aws s3 sync css "$BUCKET/css" --delete --cache-control "public, max-age=86400"
          aws s3 sync js "$BUCKET/js" --delete --cache-control "public, max-age=86400"
          aws s3 cp index.html "$BUCKET/index.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache (optional)
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
