name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - name: Formatting (Oxfmt)
        run: npx vp fmt --check
      - name: JavaScript (Oxlint)
        run: npx vp lint --deny-warnings
      - name: CSS (Stylelint)
        run: npm run lint:css
      - name: HTML (html-validate)
        run: npm run lint:html

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run actionlint-py==1.7.12.25 -color
          pipx run zizmor==1.30.1 --format=github .github/workflows

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cfn-lint checks the template against CloudFormation's own specs; Checkov checks it against
      # AWS security practice. Deliberate exceptions are explained in the template's Metadata.
      - name: cfn-lint and Checkov on infra/
        run: |
          pipx run cfn-lint==1.57.2 infra/*.yml
          pipx run checkov==3.3.29 --directory infra --framework cloudformation --compact --quiet

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - run: npm run build
      - name: Check the built site
        run: npm run verify:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          # dist/.well-known/security.txt is a hidden path and would otherwise be left out
          include-hidden-files: true

  e2e:
    name: Tests (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project=chromium --project=mobile-chrome
          - engine: firefox
            projects: --project=firefox
          - engine: webkit
            projects: --project=webkit --project=mobile-safari
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VP_GIT_HOOKS: '0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps "$ENGINE"
        env:
          ENGINE: ${{ matrix.engine }}
      - name: Playwright end-to-end and accessibility tests
        run: |
          # shellcheck disable=SC2086 # PROJECTS is a list of flags
          npx playwright test $PROJECTS
        env:
          PROJECTS: ${{ matrix.projects }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Lighthouse CI (3 runs, budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.1 autorun

  links:
    name: Links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check internal and external links
        run: npx --yes linkinator@8.1.0 dist --config linkinator.config.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # The review needs the repository's Dependency graph (Settings > Advanced Security), and on a
      # private repository GitHub Advanced Security too. Asking for the same comparison the action makes
      # covers both; the SBOM endpoint answers on private repositories without it.
      - name: Check that dependency review is available
        id: graph
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api "repos/$GH_REPO/dependency-graph/compare/$BASE...$HEAD" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Dependency review skipped: it needs Dependency graph, and GitHub Advanced Security on a private repository (see CONTRIBUTING.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: moderate
          # Strong copyleft licenses can't be mixed into the site's code.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  # The one check branch rules require, so adding or renaming jobs never needs a settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, workflows, infrastructure, build, e2e, lighthouse, links, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
